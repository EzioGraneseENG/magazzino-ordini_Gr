<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head th:replace="~{fragments :: head('Nuovo ordine')}"></head>
<body>
<header th:replace="~{fragments :: menu}"></header>
<main>
    <h1>Nuovo ordine</h1>
    <div th:replace="~{fragments :: avvisi}"></div>
    <form th:action="@{/ordini}" th:object="${form}" method="post">
        <label>Cliente
            <input type="text" th:field="*{cliente}" placeholder="es. Ferramenta Bianchi">
        </label>
        <table>
            <thead>
            <tr>
                <th>Prodotto</th>
                <th class="num">Prezzo unitario</th>
                <th class="num">Quantità</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="riga, st : *{righe}">
                <td>
                    <select class="selezione-prodotto" th:field="*{righe[__${st.index}__].codice}">
                        <option value="">—</option>
                        <option th:each="p : ${prodotti}" th:value="${p.codice}"
                                th:text="${p.nome} + ' (' + ${p.disponibili} + ' disponibili)'"
                                th:attr="data-prezzo=${#numbers.formatDecimal(p.prezzo, 1, 'POINT', 2, 'COMMA')}">Prodotto</option>
                    </select>
                </td>
                <td class="num">
                    <span class="prezzo-unitario" aria-live="polite">—</span>
                </td>
                <td class="num">
                    <input type="number" min="1" th:field="*{righe[__${st.index}__].quantita}">
                </td>
            </tr>
            </tbody>
        </table>
        <button type="submit" class="primario">Conferma ordine</button>
    </form>
    <script>
        document.querySelectorAll(".selezione-prodotto").forEach(function (selezione) {
            const prezzo = selezione.closest("tr").querySelector(".prezzo-unitario");
            const aggiornaPrezzo = function () {
                const opzione = selezione.selectedOptions[0];
                prezzo.textContent = opzione.dataset.prezzo
                    ? opzione.dataset.prezzo + " €"
                    : "—";
            };
            selezione.addEventListener("change", aggiornaPrezzo);
            aggiornaPrezzo();
        });
    </script>
</main>
</body>
</html>
